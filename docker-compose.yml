services:
  fabric-demo:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "examples/quickstart.py"]

  fabric-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "examples/benchmark_progressive_discovery.py"]
    profiles: ["benchmark"]

  legacy-backend:
    build: ./backend
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ministral-3:3b}
      - MATRIX_URL=http://mcp-matrix:8000
      - HANOI_URL=http://mcp-hanoi:8000
      - SEARXNG_URL=http://searxng:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["legacy"]

  legacy-frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-6180}:80"
    depends_on:
      - legacy-backend
    profiles: ["legacy"]

  mcp-matrix:
    build: ./mcp-matrix
    profiles: ["legacy"]

  mcp-hanoi:
    build: ./mcp-hanoi
    profiles: ["legacy"]

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/config:/etc/searxng
    profiles: ["legacy"]
